apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

android {
    namespace 'com.my.televip'
    compileSdk 36

    defaultConfig {
        applicationId "com.my.televip"
        minSdk 27
        targetSdk 36
        versionCode 335
        versionName "3.6.3"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = "1.8"
    }

}

dependencies {
    implementation("com.squareup.okhttp3:okhttp:4.12.0")
    implementation("com.google.code.gson:gson:2.13.2")
    implementation(libs.jcal)
    compileOnly libs.api
    implementation(libs.gson)
    implementation(libs.appcompat)
    implementation(libs.material)
    implementation(libs.kotlinx.coroutines.android)

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
tasks.register("copyLargestDexAsJava") {

    dependsOn(":settingsadapter:assembleDebug")

    doLast {
        def apkFile = fileTree("$rootDir/settingsadapter/build/outputs/apk/debug")
                .matching { include "*.apk" }
                .singleFile

        def tempDir = new File(buildDir, "tmp/dexExtract")
        tempDir.mkdirs()

        copy {
            from zipTree(apkFile)
            into tempDir
            include "classes*.dex"
        }

        def dexFiles = fileTree(tempDir).matching { include "classes*.dex" }.files

        if (dexFiles.isEmpty()) {
            throw new GradleException("No dex files found!")
        }

        def largestDex = dexFiles.max { it.length() }

        // قراءة dex كـ bytes
        byte[] dexBytes = largestDex.bytes

        def hex = dexBytes.collect { String.format("%02X", it) }.join("")

        def outputDir = file("$projectDir/src/main/java/com/my/televip/dex")
        outputDir.mkdirs()

        def ktFile = new File(outputDir, "DexHolder.kt")

        ktFile.text = """package com.my.televip.dex

object DexHolder {
    @JvmField
    val DEX_BYTES: ByteArray = hexToBytes("${hex}")

    private fun hexToBytes(hex: String): ByteArray {
        val len = hex.length
        val data = ByteArray(len / 2)
        var i = 0
        while (i < len) {
            data[i / 2] = ((Character.digit(hex[i], 16) shl 4) + Character.digit(hex[i + 1], 16)).toByte()
            i += 2
        }
        return data
    }
}
"""
        println "Generated DexHolder.kt with largest dex: ${largestDex.name}"
    }
}

preBuild.dependsOn("copyLargestDexAsJava")