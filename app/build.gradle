apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

android {
    namespace 'com.my.televip'
    compileSdk 36

    defaultConfig {
        applicationId "com.my.televip"
        minSdk 27
        targetSdk 36
        versionCode 330
        versionName "3.6.2"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }

}

dependencies {
    implementation(libs.jcal)
    compileOnly libs.libxposed.api
    compileOnly libs.api
    implementation(libs.gson)
    implementation(libs.appcompat)
    implementation(libs.material)
    implementation(libs.kotlinx.coroutines.core)
    implementation(libs.kotlinx.coroutines.android)

    testImplementation(libs.junit)
    androidTestImplementation(libs.ext.junit)
    androidTestImplementation(libs.espresso.core)
}
tasks.register("copyLargestDexToAssets") {

    dependsOn(":settingsadapter:assembleDebug")

    inputs.files(fileTree("$rootDir/settingsadapter/src"))
    outputs.file(file("$projectDir/src/main/assets/settings_adapter.dex"))

    doLast {
        def apkFiles = fileTree("$rootDir/settingsadapter/build")
                .matching { include "**/*.apk" }
                .files

        if (apkFiles.isEmpty()) {
            throw new GradleException("No apk files found in settingsadapter/build!")
        }

        def apkFile = apkFiles.find { it.name.endsWith("-debug.apk") || it.name.endsWith(".apk") }

        def tempDir = new File(buildDir, "tmp/dexExtract")
        tempDir.mkdirs()

        copy {
            from zipTree(apkFile)
            into tempDir
            include "classes*.dex"
        }

        def dexFiles = fileTree(tempDir).matching { include "classes*.dex" }.files

        if (dexFiles.isEmpty()) {
            throw new GradleException("No dex files found!")
        }

        def largestDex = dexFiles.max { it.length() }

        def assetsDir = file("$projectDir/src/main/assets")
        assetsDir.mkdirs()

        copy {
            from largestDex
            into assetsDir
            rename { "settings_adapter.dex" }
        }

        println "Copied largest dex (${largestDex.name}) to assets/settings_adapter.dex"
    }
}

preBuild.dependsOn("copyLargestDexToAssets")