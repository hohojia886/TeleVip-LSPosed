[versions]
kotlin = "1.9.22"
kotlinxCoroutines = "1.8.0"
libxposedApi = "102.0.0"
api = "82"
gradle = "8.2.2"
gson = "2.13.2"
jcal = "1.3.3"
appcompat = "1.7.1"
material = "1.12.0"
junit = "4.13.2"
extJunit = "1.2.1"
espresso = "3.6.1"

[libraries]
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinxCoroutines" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "kotlinxCoroutines" }
libxposed-api = { module = "io.github.libxposed:api", version.ref = "libxposedApi" }
api = { module = "de.robv.android.xposed:api", version.ref = "api" }
gradle = { module = "com.android.tools.build:gradle", version.ref = "gradle" }
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
jcal = { module = "ir.huri:JalaliCalendar", version.ref = "jcal" }
appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "extJunit" }
espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espresso" }
